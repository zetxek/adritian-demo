name: Auto-sync Theme Content on Module Update

# This workflow automatically syncs content from the theme after module updates
# It runs when go.mod is updated in a PR, detecting theme version changes

permissions:
  contents: write
  pull-requests: write

on:
  pull_request:
    paths:
      - 'go.mod'
      - 'go.sum'
    types: [opened, synchronize]

jobs:
  check-and-sync:
    runs-on: ubuntu-latest
    # Only run on preview PRs from theme updates (those with theme-update/ prefix)
    # or PRs explicitly marked as preview in the title
    if: startsWith(github.head_ref, 'theme-update/') || contains(github.event.pull_request.title, 'preview:')

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.CI_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Get theme version
        id: theme_version
        run: |
          # Extract theme version from go.mod
          THEME_VERSION=$(grep "github.com/zetxek/adritian-free-hugo-theme" go.mod | awk '{print $2}')
          echo "version=$THEME_VERSION" >> $GITHUB_OUTPUT
          echo "Theme version: $THEME_VERSION"

          # Try to extract commit SHA from pseudo-version
          # Pseudo-version format: v0.0.0-yyyymmddhhmmss-abcdefabcdef
          # where abcdefabcdef is the first 12 chars of the commit SHA
          if [[ $THEME_VERSION =~ -([0-9]+)\.[0-9]+-([0-9a-f]+)$ ]]; then
            COMMIT_SHA="${BASH_REMATCH[2]}"
            echo "commit_sha=$COMMIT_SHA" >> $GITHUB_OUTPUT
            echo "Extracted commit SHA: $COMMIT_SHA"
          else
            echo "Could not extract commit SHA from version"
            echo "commit_sha=" >> $GITHUB_OUTPUT
          fi

      - name: Checkout theme repository
        if: steps.theme_version.outputs.commit_sha != ''
        uses: actions/checkout@v4
        with:
          repository: zetxek/adritian-free-hugo-theme
          ref: ${{ steps.theme_version.outputs.commit_sha }}
          path: theme-checkout
          token: ${{ secrets.CI_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Check if content sync is needed
        if: steps.theme_version.outputs.commit_sha != ''
        id: check_sync
        run: |
          NEEDS_SYNC=false

          # Check if theme hugo.toml differs from demo
          if [ -f "theme-checkout/exampleSite/hugo.toml" ]; then
            if ! diff -q hugo.toml theme-checkout/exampleSite/hugo.toml > /dev/null 2>&1; then
              echo "hugo.toml differs from theme"
              NEEDS_SYNC=true
            fi
          fi

          # Check if theme has i18n files we don't have
          if [ -d "theme-checkout/i18n" ]; then
            shopt -s nullglob
            for file in theme-checkout/i18n/*.yaml theme-checkout/i18n/*.yml; do
              filename=$(basename "$file")
              if [ ! -f "i18n/$filename" ]; then
                echo "New i18n file found: $filename"
                NEEDS_SYNC=true
              fi
            done
            shopt -u nullglob
          fi

          # Check if theme has content files we don't have (any section)
          if [ -d "theme-checkout/exampleSite/content" ]; then
            shopt -s nullglob
            for dir in theme-checkout/exampleSite/content/*/; do
              section=$(basename "$dir")
              for file in "$dir"*; do
                [ -f "$file" ] || continue
                filename=$(basename "$file")
                if [ ! -f "content/$section/$filename" ]; then
                  echo "New content file found: $section/$filename"
                  NEEDS_SYNC=true
                fi
              done
            done
            # Check root-level content files
            for file in theme-checkout/exampleSite/content/*.md; do
              [ -f "$file" ] || continue
              filename=$(basename "$file")
              if [ ! -f "content/$filename" ]; then
                echo "New root content file found: $filename"
                NEEDS_SYNC=true
              fi
            done
            shopt -u nullglob
          fi

          echo "needs_sync=$NEEDS_SYNC" >> $GITHUB_OUTPUT

      - name: Sync hugo.toml
        if: steps.check_sync.outputs.needs_sync == 'true'
        run: |
          if [ -f "theme-checkout/exampleSite/hugo.toml" ]; then
            echo "Syncing hugo.toml from theme's exampleSite..."
            cp theme-checkout/exampleSite/hugo.toml hugo.toml

            # Apply demo-specific overrides if the override script exists
            if [ -f ".github/sync-config-overrides.sh" ]; then
              echo "Applying demo-specific config overrides..."
              bash .github/sync-config-overrides.sh hugo.toml
            fi
          fi

      - name: Sync i18n files
        if: steps.check_sync.outputs.needs_sync == 'true'
        run: |
          if [ -d "theme-checkout/i18n" ]; then
            echo "Syncing i18n files from theme..."
            mkdir -p i18n

            shopt -s nullglob
            for file in theme-checkout/i18n/*.yaml theme-checkout/i18n/*.yml; do
              filename=$(basename "$file")
              cp "$file" "i18n/$filename"
              echo "Copied $filename"
            done
            shopt -u nullglob
          fi

      - name: Sync content from theme exampleSite
        if: steps.check_sync.outputs.needs_sync == 'true'
        run: |
          if [ ! -d "theme-checkout/exampleSite/content" ]; then
            exit 0
          fi

          echo "Syncing content from theme's exampleSite..."

          # Sync all content directories
          shopt -s nullglob
          for dir in theme-checkout/exampleSite/content/*/; do
            section=$(basename "$dir")
            mkdir -p "content/$section"

            for file in "$dir"*; do
              [ -f "$file" ] || continue
              filename=$(basename "$file")
              cp "$file" "content/$section/$filename"
              echo "Copied $section/$filename"
            done
          done
          shopt -u nullglob

          # Sync root-level content files
          for file in theme-checkout/exampleSite/content/*.md; do
            [ -f "$file" ] || continue
            filename=$(basename "$file")
            cp "$file" "content/$filename"
            echo "Copied root content: $filename"
          done

      - name: Sync static and data files
        if: steps.check_sync.outputs.needs_sync == 'true'
        run: |
          if [ -d "theme-checkout/exampleSite/static" ]; then
            echo "Syncing static assets..."
            cp -r theme-checkout/exampleSite/static/* static/ 2>/dev/null || true
          fi
          if [ -d "theme-checkout/exampleSite/data" ]; then
            echo "Syncing data files..."
            mkdir -p data
            cp -r theme-checkout/exampleSite/data/* data/ 2>/dev/null || true
          fi

      - name: Commit content changes
        if: steps.check_sync.outputs.needs_sync == 'true'
        env:
          THEME_VERSION: ${{ steps.theme_version.outputs.version }}
          THEME_COMMIT: ${{ steps.theme_version.outputs.commit_sha }}
          PR_BRANCH: ${{ github.head_ref }}
        run: |
          git config --global user.name 'Git bot'
          git config --global user.email 'bot@noreply.github.com'

          if [[ -n $(git status -s) ]]; then
            git add hugo.toml i18n/ content/ static/ data/ .github/ || true

            git commit -m "Sync content from theme (auto)" \
              -m "Automatically synced configuration and content from theme version $THEME_VERSION." \
              -m "" \
              -m "This includes:" \
              -m "- hugo.toml configuration (menus, params, etc.)" \
              -m "- Translation files (i18n)" \
              -m "- All content sections" \
              -m "- Static assets and data files" \
              -m "" \
              -m "Synced from commit: $THEME_COMMIT"

            git push origin "$PR_BRANCH"

            echo "Content synced and pushed successfully"
          fi

      - name: Add comment to PR
        if: steps.check_sync.outputs.needs_sync == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.CI_TOKEN || secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          THEME_VERSION: ${{ steps.theme_version.outputs.version }}
        run: |
          gh pr comment "$PR_NUMBER" --body - <<EOF
          ✅ **Content automatically synced from theme**

          This PR has been updated with content from the theme's exampleSite (version \`$THEME_VERSION\`):
          - \`hugo.toml\` configuration (menus, params, languages)
          - Translation files (i18n/*.yaml)
          - All content sections
          - Static assets and data files

          Demo-specific overrides were applied from \`.github/sync-config-overrides.sh\` if present.
          EOF
