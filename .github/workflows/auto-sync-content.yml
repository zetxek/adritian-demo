name: Auto-sync Theme Content on Module Update

# Mirrors the theme's exampleSite into theme-update preview PRs, using the
# theme commit pinned in go.mod. Shares .github/sync-theme-content.sh with
# the sync-theme-content workflow.

permissions:
  contents: write
  pull-requests: write

on:
  pull_request:
    paths:
      - 'go.mod'
      - 'go.sum'
    types: [opened, synchronize]

jobs:
  check-and-sync:
    runs-on: ubuntu-latest
    # Only run on preview PRs from theme updates (those with theme-update/ prefix)
    # or PRs explicitly marked as preview in the title
    if: startsWith(github.head_ref, 'theme-update/') || contains(github.event.pull_request.title, 'preview:')

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.CI_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Get theme version
        id: theme_version
        env:
          GH_TOKEN: ${{ secrets.CI_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          # go.mod pins the theme on a single line:
          #   require github.com/zetxek/adritian-free-hugo-theme v1.10.5 // indirect
          # so read the first v-prefixed token on that line instead of a fixed field.
          THEME_VERSION=$(grep "github.com/zetxek/adritian-free-hugo-theme" go.mod | head -1 | awk '{ for (i = 1; i <= NF; i++) if ($i ~ /^v[0-9]/) { print $i; exit } }')
          echo "Theme version: $THEME_VERSION"

          # Release: vX.Y.Z (a tag in the theme repo)
          # Pseudo-version: vX.Y.Z-0.yyyymmddhhmmss-abcdefabcdef (12-char commit prefix),
          # or v0.0.0-yyyymmddhhmmss-abcdefabcdef when nothing is tagged after the commit.
          if [[ "$THEME_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            THEME_REF="$THEME_VERSION"
          elif [[ "$THEME_VERSION" =~ -([0-9a-f]{12,})$ ]]; then
            # actions/checkout cannot fetch an abbreviated SHA, so resolve the
            # prefix to the full commit SHA before checking the theme out.
            THEME_REF=$(gh api "repos/zetxek/adritian-free-hugo-theme/commits/${BASH_REMATCH[1]}" --jq '.sha' 2>/dev/null || true)
            if [[ -z "$THEME_REF" ]]; then
              echo "::warning::Could not resolve theme commit ${BASH_REMATCH[1]} for '$THEME_VERSION', skipping sync"
            fi
          else
            echo "::warning::Could not derive a theme ref from '$THEME_VERSION', skipping sync"
            THEME_REF=""
          fi

          echo "version=$THEME_VERSION" >> "$GITHUB_OUTPUT"
          echo "ref=$THEME_REF" >> "$GITHUB_OUTPUT"

      - name: Checkout theme repository
        if: steps.theme_version.outputs.ref != ''
        uses: actions/checkout@v4
        with:
          repository: zetxek/adritian-free-hugo-theme
          ref: ${{ steps.theme_version.outputs.ref }}
          path: theme-checkout
          token: ${{ secrets.CI_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Mirror theme exampleSite
        id: sync
        if: steps.theme_version.outputs.ref != ''
        run: |
          bash .github/sync-theme-content.sh theme-checkout
          if [[ -n $(git diff --cached --name-only) ]]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$(git -C theme-checkout rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Commit and push content changes to PR branch
        if: steps.sync.outputs.has_changes == 'true'
        env:
          THEME_VERSION: ${{ steps.theme_version.outputs.version }}
          THEME_SHA: ${{ steps.sync.outputs.sha }}
          PR_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name 'Git bot'
          git config user.email 'bot@noreply.github.com'

          git commit -m "Sync content from theme (auto)" \
            -m "Mirrored the theme's exampleSite at version $THEME_VERSION." \
            -m "Theme commit: $THEME_SHA"

          git push origin "HEAD:refs/heads/$PR_BRANCH"

      - name: Add comment to PR
        if: steps.sync.outputs.has_changes == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.CI_TOKEN || secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          THEME_VERSION: ${{ steps.theme_version.outputs.version }}
          THEME_SHA: ${{ steps.sync.outputs.sha }}
        run: |
          gh pr comment "$PR_NUMBER" --body - <<EOF
          ✅ **Content automatically synced from theme**

          Mirrored the theme's exampleSite at \`$THEME_VERSION\` ([\`${THEME_SHA:0:8}\`](https://github.com/zetxek/adritian-free-hugo-theme/commit/$THEME_SHA)):
          - \`hugo.toml\` (with overrides from \`.github/sync-config-overrides.sh\`)
          - \`content/\`, \`static/\`, \`data/\`, \`assets/\` mirrored exactly (\`assets/css/critical.css\` is kept)
          - \`i18n/\` mirrored from \`exampleSite/i18n\`, or removed when the exampleSite has none
          EOF
