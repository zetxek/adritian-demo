name: Sync Theme Content

# Mirrors the theme repository's exampleSite (hugo.toml, content, static,
# data, assets, i18n) into the demo and opens/updates a single PR.
#
# The theme sends a `sync-theme-content` repository_dispatch on every push
# to its main branch with client_payload:
#   {branch: "main", theme_ref: "<sha>", theme_branch: "main"}

permissions:
  contents: write
  pull-requests: write

on:
  repository_dispatch:
    types: [sync-theme-content]

  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch in adritian-demo to sync content to (defaults to main)'
        required: false
        default: 'main'
        type: string
      theme_branch:
        description: 'Theme branch or commit SHA to sync from (defaults to main)'
        required: false
        default: 'main'
        type: string

# Serialize runs per target branch so force-pushes to the sync branch don't race
concurrency:
  group: sync-theme-content-${{ github.event.client_payload.branch || github.event.inputs.branch || 'main' }}
  cancel-in-progress: false

jobs:
  sync-content:
    runs-on: ubuntu-latest

    steps:
      - name: Determine and validate inputs
        id: determine_branch
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_BRANCH: ${{ github.event.client_payload.branch }}
          DISPATCH_THEME_REF: ${{ github.event.client_payload.theme_ref }}
          DISPATCH_THEME_BRANCH: ${{ github.event.client_payload.theme_branch }}
          INPUT_BRANCH: ${{ github.event.inputs.branch }}
          INPUT_THEME_BRANCH: ${{ github.event.inputs.theme_branch }}
        run: |
          if [ "$EVENT_NAME" == "repository_dispatch" ]; then
            BRANCH="$DISPATCH_BRANCH"
            THEME_REF="$DISPATCH_THEME_REF"
            THEME_BRANCH="$DISPATCH_THEME_BRANCH"
          else
            BRANCH="$INPUT_BRANCH"
            THEME_REF="$INPUT_THEME_BRANCH"
            THEME_BRANCH="$INPUT_THEME_BRANCH"
          fi

          BRANCH="${BRANCH:-main}"
          THEME_BRANCH="${THEME_BRANCH:-main}"
          THEME_REF="${THEME_REF:-$THEME_BRANCH}"

          is_branch_name() {
            [[ "$1" =~ ^[A-Za-z0-9._/-]+$ ]] && [[ "$1" != -* ]] && [[ "$1" != *..* ]]
          }

          if [ "$BRANCH" != "main" ] && ! is_branch_name "$BRANCH"; then
            echo "::error::Invalid branch: must be 'main' or match ^[A-Za-z0-9._/-]+\$"
            exit 1
          fi
          if ! is_branch_name "$THEME_BRANCH"; then
            echo "::error::Invalid theme_branch: must match ^[A-Za-z0-9._/-]+\$"
            exit 1
          fi
          if ! [[ "$THEME_REF" =~ ^[0-9a-f]{7,40}$ ]] && ! is_branch_name "$THEME_REF"; then
            echo "::error::Invalid theme_ref: must be a commit SHA (^[0-9a-f]{7,40}\$) or a branch name"
            exit 1
          fi

          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "theme_ref=$THEME_REF" >> "$GITHUB_OUTPUT"
          echo "theme_branch=$THEME_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Checkout demo repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.determine_branch.outputs.branch }}
          token: ${{ secrets.CI_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Checkout theme repository
        uses: actions/checkout@v4
        with:
          repository: zetxek/adritian-free-hugo-theme
          ref: ${{ steps.determine_branch.outputs.theme_ref }}
          path: theme-checkout
          token: ${{ secrets.CI_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Resolve theme commit
        id: theme_commit
        run: |
          echo "sha=$(git -C theme-checkout rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git -C theme-checkout rev-parse --short=8 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Mirror theme exampleSite
        run: bash .github/sync-theme-content.sh theme-checkout

      - name: Create or update PR
        env:
          BASE_BRANCH: ${{ steps.determine_branch.outputs.branch }}
          THEME_BRANCH: ${{ steps.determine_branch.outputs.theme_branch }}
          THEME_SHA: ${{ steps.theme_commit.outputs.sha }}
          THEME_SHORT_SHA: ${{ steps.theme_commit.outputs.short_sha }}
          GITHUB_TOKEN: ${{ secrets.CI_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          if [[ -z $(git diff --cached --name-only) ]]; then
            echo "Demo already mirrors theme $THEME_SHORT_SHA, nothing to do"
            exit 0
          fi

          # One stable branch per target branch: re-running force-pushes it
          # and updates the open PR instead of opening a new one.
          PR_BRANCH="sync-theme-content/${BASE_BRANCH}"
          THEME_COMMIT_URL="https://github.com/zetxek/adritian-free-hugo-theme/commit/${THEME_SHA}"
          TITLE="[auto] Sync content from theme @ ${THEME_SHORT_SHA}"

          git config user.name 'Git bot'
          git config user.email 'bot@noreply.github.com'

          git checkout -b "$PR_BRANCH"
          git commit -m "Sync content from theme @ ${THEME_SHORT_SHA}" \
            -m "Mirrored the theme's exampleSite (hugo.toml, content, static, data, assets, i18n)." \
            -m "Theme commit: ${THEME_SHA} (${THEME_BRANCH})"
          git push --force origin "HEAD:refs/heads/${PR_BRANCH}"

          BODY=$(cat <<EOF
          ## Summary
          Mirrors the theme's exampleSite at [\`${THEME_SHORT_SHA}\`](${THEME_COMMIT_URL}) (\`${THEME_BRANCH}\`) into the demo.

          - \`hugo.toml\` (with overrides from \`.github/sync-config-overrides.sh\`)
          - \`content/\`, \`static/\`, \`data/\`, \`assets/\` mirrored exactly (files removed from the theme are removed here; \`assets/css/critical.css\` is kept)
          - \`i18n/\` mirrored from \`exampleSite/i18n\`, or removed when the exampleSite has none (translations come from the theme module)

          This PR is force-updated by each sync run, so it always reflects the latest theme commit.

          Theme commit: ${THEME_SHA}

          🤖 Created by [Sync Theme Content](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) workflow
          EOF
          )

          EXISTING_PR=$(gh pr list --head "$PR_BRANCH" --base "$BASE_BRANCH" --state open --json number --jq '.[0].number')
          if [ -n "$EXISTING_PR" ]; then
            gh pr edit "$EXISTING_PR" --title "$TITLE" --body "$BODY"
            echo "Updated PR #$EXISTING_PR"
          else
            gh pr create --base "$BASE_BRANCH" --head "$PR_BRANCH" --title "$TITLE" --body "$BODY"
          fi
